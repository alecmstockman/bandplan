<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BandPlan</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/navigation.css">
    <link rel="stylesheet" href="/static/chat.css">
    <link rel="stylesheet" href="/static/body.css">
    <link rel="stylesheet" href="/static/songs.css">
    <link rel="stylesheet" href="/static/setlists.css">
    <link rel="stylesheet" href="/static/goals.css">
    <link rel="stylesheet" href="/static/calendar.css">
    <link rel="stylesheet" href="/static/files.css">
    <link rel="stylesheet" href="/static/songs-add.css">
  </head>

  <body>
    <div class="content-box">

      <div class="header">

        <div class="menu">
          <button 
            class="open-side-menu-button"
            type="button" 
            id="menu-button">
            ☰
          </button>

          <div id="left-menu" class="side-menu">
            <div class="side-menu-header">
              <button class="close-left-menu-button" type="button" id="close-left-menu">❮</button>
            </div>

            <button 
              class="side-menu-button" 
              hx-post="/" 
              hx-target=".content-box" 
              hx-swap="innerHTML"
              type="button"
              >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-messages-square-icon lucide-messages-square"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/></svg>
              <span>Chat</span>
            </button>

            <button
              class="side-menu-button"
              hx-get="/songs"
              hx-target=".content-box"
              hx-swap="innerHTML"
              hx-push-url="true"
              onclick="document.getElementById('left-menu').classList.remove('toggle')"
              type="button">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-disc">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="2"/>
              </svg>
              <span>Songs</span>
            </button>

            <button 
              class="side-menu-button" 
              hx-post="/setlists" 
              hx-target=".content-box" 
              hx-swap="innerHTML"
              hx-push-url="true"
              onclick="document.getElementById('left-menu').classList.remove('toggle')"
              type="button"
              >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-video-icon lucide-list-video"><path d="M21 5H3"/><path d="M10 12H3"/><path d="M10 19H3"/><path d="M15 12.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997a1 1 0 0 1-1.517-.86z"/></svg>
              <span>Setlists</span>          
            </button>

            <button
              class="side-menu-button"
              hx-get="/promotion"
              hx-target=".content-box"
              hx-swap="innerHTML"
              hx-push-url="true"
              onclick="document.getElementById('left-menu').classList.remove('toggle')"
              type="button">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-fading-plus-icon lucide-circle-fading-plus"><path d="M12 2a10 10 0 0 1 7.38 16.75"/><path d="M12 8v8"/><path d="M16 12H8"/><path d="M2.5 8.875a10 10 0 0 0-.5 3"/><path d="M2.83 16a10 10 0 0 0 2.43 3.4"/><path d="M4.636 5.235a10 10 0 0 1 .891-.857"/><path d="M8.644 21.42a10 10 0 0 0 7.631-.38"/></svg>
              <span>Promotion</span>
            </button>

            <button 
              class="side-menu-button" 
              hx-post="/calendar" 
              hx-target=".content-box" 
              hx-swap="innerHTML"
              hx-push-url="true"
              onclick="document.getElementById('left-menu').classList.remove('toggle')"
              type="button"
              >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-days-icon lucide-calendar-days"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
              <span>Calendar</span>
            </button>

            <button 
              class="side-menu-button" 
              hx-post="/files" 
              hx-target=".content-box" 
              hx-swap="innerHTML"
              hx-push-url="true"
              onclick="document.getElementById('left-menu').classList.remove('toggle')"
              type="button"
              >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder-icon lucide-folder"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
              <span>Files</span>
            </button>
          </div>
        </div>

        <div class="header-center">
          <h1 class="title">BandPlan</h1>
          <h2 class="band">{{ .Band.Name }}</h2>
        </div>

        <div class="account">
          <button type="button">😵‍💫</button>
        </div>

      </div> <!-- closes header -->


    <div class="goals">
      Goals
    </div>


    </div> <!-- closes content-box -->

    <script>
      document.getElementById("menu-button").addEventListener("click", () => {
        document.getElementById("left-menu").classList.toggle("toggle");
      });

      document.getElementById("close-left-menu").addEventListener("click", () => {
        document.getElementById("left-menu").classList.toggle("toggle");
      });
    </script>
  </body>
</html>
