<!DOCTYPE html>
<html lang="en">

  {{ template "head" .}}

  <body>
    <div class="content-box">

      <div class="header">

        <div class="menu">
          <button 
            class="open-side-menu-button"
            type="button" 
            id="menu-button">
            ☰
          </button>

          {{ template "left_sidebar_menu" .}}
          
        </div>

        <div class="header-center">
          <h1 class="title">BandPlan</h1>
          <h2 class="band">{{ capitalizeBandName .Band.Name }}</h2>
        </div>

        <a 
          class="open-setlist"
          id="add-song-button"
          href="/setlist">
          <svg 
            xmlns="http://www.w3.org/2000/svg" 
            width="48" height="48" 
            viewBox="0 0 24 24" fill="none" 
            stroke="currentColor" stroke-width="3" 
            stroke-linecap="round" stroke-linejoin="round" 
            class="lucide lucide-plus-icon lucide-plus">
            <path d="M5 12h14"/><path d="M12 5v14"/>
          </svg>
        </a>
      </div>

      <div class="setlists-content-box">
        <div class="setlists-header">
          <div class="setlists-header-left"></div>

          <div class="setlists-header-center">
            <span class="setlists-header-top"> Setlists</span>
            <span class="setlists-header-bottom">Create and manage your setlists</span>
          </div>

          <div class="setlists-header-right"> 
            <button 
              type="button"
              class="setlists-add-setlist"
              id="setlists-add-setlist"
              hx-target=".setlists-content-box"
              hx-get="/setlists/add"
              swap="outerHTML"
              hx-push-url="true"
              onclick="document.getElementById('left-menu').classList.remove('toggle')"
              >     
              {{ template "svg_setlists_add" . }}
              New Setlist
            </button>
          </div>
        </div>


        <div class="setlists-search-header">
          <div class="setlists-search-left"></div>

          <div class="setlists-search-center">
            <input
            class="setlists-search-bar"
            type="search"
            name="q"
            placeholder="Search setlists..."
            hx-get="/setlists/search"
            hx-trigger="keyup changed delay:200ms"
            hx-target=".songs-list">
          </div>
          <div class="setlists-search-right"></div>
        </div>

        <div class="setlists-card-box">
        
          <a class="setlist-card">
            <div class="setlist-card-top">
              <div class="setlist-card-top-image-box"></div>

              <div class="setlist-card-top-center">
                <span class="setlist-card-name">Setlist Title</span>
                <span class="setlist-card-info-row">18 songs | Songs - 0:00</span>
                <span class="setlist-card-edit-row">Last edited:</span>
              </div>

              <div class="setlist-card-top-right">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-ellipsis-vertical-icon lucide-ellipsis-vertical"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
              </div>
            </div>

            <div class="setlist-card-bottom">
              <!-- <button class="setlist-card-bottom-one">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-drum-icon lucide-drum"><path d="m2 2 8 8"/><path d="m22 2-8 8"/><ellipse cx="12" cy="9" rx="10" ry="5"/><path d="M7 13.4v7.9"/><path d="M12 14v8"/><path d="M17 13.4v7.9"/><path d="M2 9v8a10 5 0 0 0 20 0V9"/></svg>
                Practice
              </button> -->
              <div class="setlist-card-bottom-two">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text-icon lucide-file-text"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                Export PDF
              </div>
              <div class="setlist-card-bottom-three">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-days-icon lucide-calendar-days"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
                Event
              </div>
              <div class="setlist-card-bottom-four">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-share-icon lucide-share"><path d="M12 2v13"/><path d="m16 6-4-4-4 4"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/></svg>
                Share
              </div>
            </div>
          </a>

        </div>

      </div>
    </div>
    

  </body>
</html>
