

{{ define "setlist_song_count" }}
    <div 
        class="setlist-content-header-section"
        id="setlist-content-header-section-count">
        <button 
          class="setlist-content-header-box"
          hx-get="/setlist/count/transitions?id={{ .Setlist.SetlistID }}"
          hx-target="#setlist-content-header-section-count"
          hx-swap="outerHTML">
          <div class="setlist-content-header-left">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-music-icon lucide-music"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </div>
          <div class="setlist-content-header-right">
            <p class="setlist-content-header-top">{{ setlistSongCount .Setlist.Songs }}</p>
            <p class="setlist-content-header-bottom">Songs</p>
          </div>
        </button>
      </div>
{{ end }}
