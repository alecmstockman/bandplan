<!DOCTYPE html>
<html lang="en">
  
  {{ template "head" .}}

  <body>
    <div class="content-box">

    <div class="setlist-header">    

      <button 
        class="setlist-header-back-button" 
        hx-get="/setlists"
        hx-target=".content-box"
        hx-swap="innerHTML"
        hx-push-url="true"
        onclick="document.getElementById('left-menu').classList.remove('toggle')"
        type="button">
        ❮
      </button>

      <div class="song-header-title">
        Setlist
      </div>

      <div class="song-header-right"></div>
    </div>

    <div class="setlist-content-header">
        {{ .Setlist.Name }}
      </div>

    <div class="setlist-content-box">

      {{ range $index, $song := .Setlist.Songs }}

        <div class="setlist-song-card">
          <div class="setlist-card-position">{{ .Position }}.</div>
          <div class="setlist-card-title">{{ .Song.Title }}</div>
          <div class="setlist-card-length">{{ .Song.LengthSeconds }}</div>
          
          
        </div>

      {{ end }}

      




    </div>
  </body>
</html>
