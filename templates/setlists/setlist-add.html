
<div class="setlists-content-box">
  <div class="setlist-add-header">

    <a 
      class="setlist-add-header-left"
      href="/setlists">
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
    </a>

    <div class="setlist-add-header-center">Create Setlist</div>
    <div class="setlist-add-header-right"></div>

  </div>

  <form 
    class="setlist-add-form"
    hx-post="/setlist/create"
    hx-target=".content-box"
    hx-swap="innerHTML"
    hx-push-url="true"
    enctype="multipart/form-data">

      <div class="setlist-add-card">
      
        <div class="setlist-add-card-field-row">
          <label class="setlist-add-field-row-label" for="setlist-title">Setlist Title:</label>
          <input 
            class="setlist-field-row-input" 
            type="text" 
            name="setlist-title" 
            placeholder="Enter Setlist Title              ** Required **"
            required
            maxlength="800"
            autofocus>
        </div>

        <div class="setlist-add-card-field-row">
          <label class="setlist-add-field-row-label" for="artwork-path">Artwork Filepath:</label>
          <input
            id="artwork-path"
            class="field-row-input"
            type="file"
            name="artwork-path"
            accept="image/*">
        </div>

      </div>
        
      <div class="add-setlist-card"></div>
      

  </form>
</div>
