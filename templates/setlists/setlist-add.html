<!DOCTYPE html>
<html lang="en">

  {{ template "head" . }}

<body>
  <div class="content-box">
    <div class="header">

      <div class="menu">
        <button 
          class="open-side-menu-button"
          type="button" 
          id="menu-button">
          ☰
        </button>

        {{ template "left_sidebar_menu" .}}
        
      </div>

      <div class="header-center">
        <h1 class="title">BandPlan</h1>
        <h2 class="band">{{ capitalizeBandName .Band.Name }}</h2>
      </div>

      <div class="account">

        <a 
          class="open-add-song-button"
          id="add-song-button"
          href="/songs/add">
          +
        </a>

        <div id="right-menu" class="right-menu">
          <div class="right-menu-header">
            <button 
              class="close-right-menu-button" 
              type="button" 
              id="close-right-menu">
              ❯
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="setlists-content-box">

      <form
        class="setlist-add-form"
        href="/setlists/create"
        hx-post="/setlists/create"
        hx-swap="none"
        enctype="multipart/form-data">

        <div class="setlist-add-header">

          <a 
            class="setlist-add-header-left"
            href="/setlists">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
          </a>

          <div class="setlist-add-header-center">Create Setlist</div>
          <button
            class="setlist-add-header-right"
            type="submit"
            aria-label="Create setlist">
            
            {{ template "svg_add" . }}
          </button>
        </div>

        <div class="setlist-add-card">
        
          <div class="setlist-add-field-row-label">
            {{ template "svg_write" . }}

            <label
              class="setlist-add-card-label"
              for="setlist-title">
              Setlist Title:
            </label>
          </div>

          <input
            id="setlist-title"
            class="setlist-field-row-input"
            type="text"
            name="setlist-title"
            placeholder="Enter Setlist Title"
            required
            maxlength="120"
            autofocus>

          <div class="setlist-add-field-row-label">
            {{ template "svg_image" . }}
            <label
              class="setlist-add-card-label"
              for="artwork-path">
              Artwork:
            </label>
          </div>


          <div class="setlists-artwork-upload">
            <input
              id="artwork-path"
              class="field-row-input-artwork"
              type="file"
              name="artwork-path"
              accept="image/*">

            <div class="setlist-add-cloud">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-cloud-upload-icon lucide-cloud-upload"><path d="M12 13v8"/><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="m8 17 4-4 4 4"/></svg>
            </div>

            <span class="setlist-add-artwork">Upload Artwork</span>

            <span class="setlist-add-file">JPG, PNG, or WebP - Max 5MB</span>

            <label for="artwork-path" class="artwork-upload-button">
              Choose Artwork
            </label>

            <!-- <span id="artwork-file-name" class="artwork-file-name">
              No file selected
            </span> -->
          </div>


          <div class="setlist-add-field-row-label">
            <div id="setlist-notes">{{ template "svg_notes" . }}</div>
            <label class="field-row-label" for="notes">Notes:</label>
          </div>
          <textarea
            id="notes"
            class="field-row-input notes-input"
            name="notes"
            placeholder="Enter Notes"></textarea>

        </div>

        <div class="add-setlist-card">

        </div>
          
        <div class="add-setlist-card"></div>
          
      </form>
    </div>
  </div>

</body>
</html>
