<!DOCTYPE html>
<html lang="en">

  {{ template "head" . }}

  <body>
    <div class="content-box">

      <div class="settings-header">
        <a
          class="settings-header-back-button"
          href="/settings"
          aria-label="Back to settings">
          {{ template "svg_back" . }}
        </a>
        <div class="settings-header-title">
          Password
        </div>
        <div class="settings-header-right"></div>
      </div>

      <main class="settings-content password-settings-content">
        <div class="settings-intro">
          <span class="settings-eyebrow">Account</span>
          <h1>Change Password</h1>
          <p>Enter and confirm your new password.</p>
        </div>

        <form
          class="password-settings-form"
          action="/settings/password"
          method="post">
          <input type="hidden" name="gorilla.csrf.Token" value="{{ .CSRFToken }}">

          <div class="password-settings-field">
            <label for="password">New password</label>
            <input
              id="password"
              type="password"
              name="password"
              minlength="8"
              maxlength="255"
              autocomplete="new-password"
              required
              autofocus>
          </div>

          <div class="password-settings-field">
            <label for="password-confirmation">Confirm new password</label>
            <input
              id="password-confirmation"
              type="password"
              name="password-confirmation"
              minlength="8"
              maxlength="255"
              autocomplete="new-password"
              required>
          </div>

          <p class="password-settings-help">
            Passwords must be at least 8 characters.
          </p>

          {{ if .Error }}
            <p class="password-settings-error" role="alert">
              {{ .Error }}
            </p>
          {{ end }}

          <button class="password-settings-submit" type="submit">
            Save Password
          </button>
        </form>
      </main>
    </div>
  </body>

</html>
