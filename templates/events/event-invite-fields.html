{{ define "event-invite-fields" }}
<div class="event-add-field-row-label">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
  <span class="setlist-add-card-label">
    Invite:
  </span>
</div>

<fieldset class="event-invite-list">
  <legend class="sr-only">Choose event invitees</legend>

  <label class="event-invite-option event-invite-band">
    <input
      id="invite-band"
      type="checkbox"
      {{ if .AllSelected }}checked{{ end }}>
    <span>{{ .BandName }}</span>
  </label>

  {{ range .Members }}
    <label class="event-invite-option">
      <input
        class="invite-member"
        type="checkbox"
        name="invitee-user-id"
        value="{{ .UserID }}"
        {{ if .Selected }}checked{{ end }}>
      <span>{{ .DisplayName }}</span>
    </label>
  {{ end }}
</fieldset>
{{ end }}

{{ define "event-invite-script" }}
<script>
  const inviteBand = document.getElementById("invite-band");
  const inviteMembers = Array.from(document.querySelectorAll(".invite-member"));

  inviteBand?.addEventListener("change", function () {
    inviteMembers.forEach((member) => {
      member.checked = inviteBand.checked;
    });
  });

  inviteMembers.forEach((member) => {
    member.addEventListener("change", function () {
      inviteBand.checked =
        inviteMembers.length > 0 &&
        inviteMembers.every((invitee) => invitee.checked);
    });
  });
</script>
{{ end }}
