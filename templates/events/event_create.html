<!DOCTYPE html>
<html lang="en">

  {{ template "head" . }}

<body>
  <div class="content-box">
    <div class="header">

      <div class="menu">
        <button 
          class="open-side-menu-button"
          type="button" 
          id="menu-button">
          {{ template "svg_hamburger_menu" . }}
        </button>        
      </div>

      <div class="header-center">
        <h1 class="title">BandPlan</h1>
        <h2 class="band">{{ capitalizeBandName .Band.Name }}</h2>
      </div>

      <div class="account">
        <button 
          class="open-right-menu-button"
          type="button"
          id="right-menu-button">
          {{ if .User.ProfileImagePath }}
            <img
              class="profile-pic-display"
              src="{{ smallImagePath .User.ProfileImagePath }}"
              alt="profile picture"
              >
          {{ else }}
            <img class="songs-art-display-placeholder">
          {{ end }} 
        </button>
      </div>
    </div>

    <div class="setlists-content-box">

      <form
        class="setlist-add-form"
        action="/events/save"
        method="post"
        enctype="multipart/form-data"
        hx-post="/events/save"
        hx-encoding="multipart/form-data"
        hx-swap="none">

        <div class="setlist-add-header">

          <a 
            class="setlist-add-header-left"
            href="/events">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
          </a>

          <div class="setlist-add-header-center">Create Event</div>
          <button
            class="setlist-add-header-right"
            type="submit"
            aria-label="Create setlist"
            href="/events/save">
            {{ template "svg_add" . }}
          </button>
        </div>

        <div class="setlist-add-card-box">
          <div class="setlist-add-card">

            <div
              id="setlist-artwork-section"
              class="setlists-artwork-upload">

              <input
                id="artwork-path"
                class="field-row-input-artwork"
                type="file"
                name="artwork-path"
                accept="image/jpeg,image/png,image/webp"
                hx-post="/event/temp-art/add"
                hx-trigger="change"
                hx-encoding="multipart/form-data"
                hx-target="#setlist-artwork-section"
                hx-swap="outerHTML"
                hx-indicator="#artwork-upload-indicator">

              <div class="setlist-add-cloud">
                {{ template "svg_cloud" . }}
              </div>

              <span class="setlist-add-artwork">
                Event Image
              </span>

              <span 
                class="setlist-add-file">
                JPG, PNG, or WebP - Max 5MB
              </span>

              <label 
                for="artwork-path" 
                class="artwork-upload-button">
                Choose Image
              </label>
            </div>


            <input
              id="event-name"
              class="setlist-field-row-input"
              type="text"
              name="event-name"
              placeholder="Enter Setlist Title"
              maxlength="120"
              required
              autofocus
            >

            <input
              id="event-date"
              class="setlist-field-row-input"
              type="text"
              name="event-date"
              placeholder="Event Date"
              maxlength="120"
              autofocus
            >

            <input
              id="event-start-time"
              class="setlist-field-row-input"
              type="text"
              name="event-start-time"
              placeholder="Event Start Time"
              maxlength="120"
              autofocus
            >

            <input
              id="event-end-time"
              class="setlist-field-row-input"
              type="text"
              name="event-end-time"
              placeholder="Event End Time"
              maxlength="120"
              autofocus
            >

            <input
              id="event-location-name"
              class="setlist-field-row-input"
              type="text"
              name="event-location-name"
              placeholder="Location Name"
              maxlength="120"
            >

            <input
              id="event-location"
              class="setlist-field-row-input"
              type="text"
              name="event-location"
              placeholder="Event Address"
              maxlength="120"
            >

            <div class="card-divider-horizontal"></div>

            <input
              id="link-one-name"
              class="setlist-field-row-input"
              type="text"
              name="link-one-name"
              placeholder="Link One Name"
              maxlength="120"
            >

            <input
              id="link-one"
              class="setlist-field-row-input"
              type="text"
              name="link-one"
              placeholder="Link One"
              maxlength="120"
            >

            <div class="card-divider-horizontal"></div>
            

            <input
              id="link-two-name"
              class="setlist-field-row-input"
              type="text"
              name="link-two-name"
              placeholder="Link Two Name"
              maxlength="120"
            >

            <input
              id="link-one"
              class="setlist-field-row-input"
              type="text"
              name="link-two"
              placeholder="Link Two"
              maxlength="120"
            >






            <textarea
              id="notes"
              class="notes-input"
              name="notes"
              placeholder="Event Description Notes"
              oninput="this.style.height='0px'; this.style.height=this.scrollHeight+'px';"></textarea>
          </div>
          
          <div class="add-setlist-card"></div>
        </div>
          
      </form>
    </div>
  </div>

  {{ template "left_sidebar_menu" .}}
  {{ template "right_sidebar" . }}
  {{ template "backdrop" . }}
  {{ template "sidebar_scripts" . }}

  <script>
    document.addEventListener("input", function (event) {
      if (!event.target.matches(".notes-input")) return;

      const textarea = event.target;

      textarea.style.height = "auto";
      textarea.style.height = textarea.scrollHeight + "px";
    });
  </script>
  
</body>
</html>
