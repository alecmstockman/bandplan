<!DOCTYPE html>
<html lang="en">

  {{ template "head" . }}

  <body>
    <div class="content-box">
      <div class="add-song-header">
        Edit Event:
      </div>

      <form
        id="song-edit-form"
        class="add-songs"
        method="POST"
        action="/event/update"
        enctype="multipart/form-data">
        <input type="hidden" name="song-id" value="{{ .Event.EventID }}">

        <div class="add-songs-form">
          <div class="add-songs-card">
            <div class="add-songs-field-row">
              <label class="field-row-label" for="song-title">Event Name:</label>
              <input
                id="song-title"
                class="field-row-input"
                type="text"
                name="song-title"
                value="{{ .Event.Name }}"
                required
                maxlength="800"
                autofocus>
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="artist-name">Event Date:</label>
              <input
                id="artist-name"
                class="field-row-input"
                type="text"
                name="artist-name"
                value="{{ formatReleaseDate .Event.EventDate }}"
                required
                maxlength="800">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="album-name">Event Type:</label>
              <input
                id="album-name"
                class="field-row-input"
                type="text"
                name="album-name"
                value="{{ .Event.EventType }}"
                maxlength="200">
            </div>
          </div>

          <div class="songs-add-artwork-row">
            <label class="songs-add-artwork-label" for="artwork-path">Event Image:</label>
            <input
              id="artwork-path"
              class="field-row-input"
              type="file"
              name="artwork-path"
              accept="image/*">
          </div>

          <div class="add-songs-card">
            <div class="add-songs-field-row">
              <label class="field-row-label" for="minutes">Recurrence:</label>
              <input
                id="minutes"
                type="number"
                name="minutes"
                min="0"
                max="99"
                value="{{ .Event.Recurrence }}">
              :
              <input
                id="seconds"
                type="number"
                name="seconds"
                min="0"
                max="59"
                value="">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="release-date">Location:</label>
              <input
                id="release-date"
                class="field-row-input"
                type="date"
                name="release-date"
                value="{{ .Event.Location }}">
            </div>

            <div class="event-edit-field-row">
              <label class="field-row-label" for="genre">Address:</label>
              <input
                id="genre"
                class="field-row-input"
                type="text"
                name="genre"
                value="{{ .Event.Address }}"
                maxlength="100">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="recording-bpm">Start Time:</label>
              <input
                id="recording-bpm"
                class="field-row-input"
                type="text"
                name="recording-bpm"
                value="{{ if .Event.StartTime }}{{ formatTime .Event.StartTime }}{{ end }}"
                inputmode="numeric"
                pattern="[0-9]*"
                maxlength="4">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="live-bpm">End Time:</label>
              <input
                id="live-bpm"
                class="field-row-input"
                type="number"
                name="live-bpm"
                value="{{ if .Event.EndTime }}{{ formatTime .Event.EndTime }}{{ end }}"
                min="0"
                max="500">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="time-signature">Time Zone:</label>
              <input
                id="time-signature"
                class="field-row-input"
                type="text"
                name="time-signature"
                value="{{ .Event.Timezone }}"
                maxlength="20">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="original-key">Set Location:</label>
              <input
                id="original-key"
                class="field-row-input"
                type="text"
                name="original-key"
                value="{{ .Event.SetLocation }}"
                maxlength="20">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="live-key">Load-in Time:</label>
              <input
                id="live-key"
                class="field-row-input"
                type="text"
                name="live-key"
                value="{{ if .Event.LoadInTime }}{{ formatTime .Event.LoadInTime }}{{ end }}"
                maxlength="20">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="tuning">Load-in Instructions:</label>
              <input
                id="tuning"
                class="field-row-input"
                type="text"
                name="tuning"
                value="{{ .Event.LoadInInstructions }}"
                maxlength="50">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="capo">Set Time:</label>
              <input
                id="capo"
                class="field-row-input"
                type="text"
                name="capo"
                value="{{ if .Event.SetTime }}{{ formatTime .Event.SetTime }}{{ end }}"
                maxlength="50">
            </div>
          </div>

          <div class="settings-row">
            <div class="settings-row-div">
              <label class="settings-row-label" for="status">Set Length</label>
              <select id="status" name="status" value="{{ formatMinutes .Event.SetLengthSeconds }}">
                <option value="Demo">Demo</option>
                <option value="Recording">Recording</option>
                <option value="Finished">Finished</option>
                <option value="Released">Released</option>
              </select>
            </div>

            <div class="settings-row-div">
              <div class="settings-row-section">
                <span class="settings-row-label">Venue Name</span>
                <label class="switch">
                  <input type="checkbox" name="explicit" value="{{ .Event.VenueName }}">
                  <span class="slider"></span>
                </label>
              </div>

              <div class="settings-row-section">
                <span class="settings-row-label">Address Line 1</span>
                <label class="switch">
                  <input type="checkbox" name="is-cover" value="{{ .Event.AddressOne }}">
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </div>

          <div class="add-songs-card">
            <div class="add-songs-field-row">
              <label class="field-row-label" for="spotify-link">Address Line 2:</label>
              <input id="spotify-link" class="field-row-input" type="url" name="spotify-link" value="{{ .Event.AddressTwo }}" placeholder="https://...">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="apple-music-link">City:</label>
              <input id="apple-music-link" class="field-row-input" type="url" name="apple-music-link" value="{{ .Event.City }}" placeholder="https://...">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="state">State:</label>
              <input id="state" class="field-row-input" type="text" name="state" value="{{ .Event.State }}">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="zip-code">ZIP Code:</label>
              <input id="zip-code" class="field-row-input" type="text" name="zip-code" value="{{ .Event.ZipCode }}">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="presale-ticket-price">Presale Ticket Price:</label>
              <input id="presale-ticket-price" class="field-row-input" type="text" name="presale-ticket-price" value="{{ .Event.PresaleTicketPrice }}">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="ticket-price">Ticket Price:</label>
              <input id="ticket-price" class="field-row-input" type="text" name="ticket-price" value="{{ .Event.TicketPrice }}">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="ticket-link">Ticket Link:</label>
              <input id="ticket-link" class="field-row-input" type="text" name="ticket-link" value="{{ .Event.TicketLink }}">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="notes">Notes:</label>
              <input id="notes" class="field-row-input" type="text" name="notes" value="{{ .Event.Notes }}">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="link-one-name">Link One Name:</label>
              <input id="link-one-name" class="field-row-input" type="text" name="link-one-name" value="{{ .Event.LinkOneName }}">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="link-one">Link One:</label>
              <input id="link-one" class="field-row-input" type="text" name="link-one" value="{{ .Event.LinkOne }}">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="link-two-name">Link Two Name:</label>
              <input id="link-two-name" class="field-row-input" type="text" name="link-two-name" value="{{ .Event.LinkTwoName }}">
            </div>

            <div class="add-songs-field-row">
              <label class="field-row-label" for="link-two">Link Two:</label>
              <input id="link-two" class="field-row-input" type="text" name="link-two" value="{{ .Event.LinkTwo }}">
            </div>
          </div>



        <div class="songs-add-footer">
          <div id="songs-add-left">
            <a id="songs-add-cancel" href="/events">Cancel</a>
          </div>

          <div id="songs-add-right">
            <button id="songs-add-save" type="submit">Save</button>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
