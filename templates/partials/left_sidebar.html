
{{ define "left_sidebar_menu" }}

  <div class="side-menu" id="left-menu">
    <div class="side-menu-header">
      <button class="close-left-menu-button" type="button" id="close-left-menu">❮</button>
    </div>

    <div class="side-menu-links">

      <button
        class="left-menu-links-row"
        hx-post="/"
        hx-target=".content-box"
        hx-swap="innerHTML"
        type="button">

        <span class="left-menu-links-icon">
          {{ template "svg_chat" . }}
        </span>

        <span class="left-menu-links-link">
          Chat
        </span>
      </button>

      <button
        class="left-menu-links-row"
        hx-get="/songs"
        hx-target=".content-box"
        hx-swap="innerHTML"
        hx-push-url="true"
        onclick="document.getElementById('left-menu').classList.remove('toggle')"
        type="button">
        
        <span class="left-menu-links-icon">
          {{ template "svg_chat" . }}
        </span>

        <span class="left-menu-links-link">
          Songs
        </span>
      </button>

      <button 
        class="left-menu-links-row"
        hx-post="/setlists" 
        hx-target=".content-box" 
        hx-swap="innerHTML"
        hx-push-url="true"
        onclick="document.getElementById('left-menu').classList.remove('toggle')"
        type="button">

        <span class="left-menu-links-icon">
          {{ template "svg_setlists" . }}
        </span>

        <span class="left-menu-links-link">
          Setlists
        </span>          
      </button>

      <button
        class="left-menu-links-row"
        hx-get="/promotion"
        hx-target=".content-box"
        hx-swap="innerHTML"
        hx-push-url="true"
        onclick="document.getElementById('left-menu').classList.remove('toggle')"
        type="button">

        <span class="left-menu-links-icon">
          {{ template "svg_promotion" . }}
        </span>

        <span class="left-menu-links-link">
          Promotion
        </span>
      </button>

      <button 
        class="left-menu-links-row"
        hx-post="/goals" 
        hx-target=".content-box" 
        hx-swap="innerHTML"
        hx-push-url="true"
        onclick="document.getElementById('left-menu').classList.remove('toggle')"
        type="button">
        
        <span class="left-menu-links-icon">
          {{ template "svg_goals" . }}
        </span>

        <span class="left-menu-links-link">
          Goals
        </span>
      </button>

      <button 
        class="left-menu-links-row"
        hx-post="/calendar" 
        hx-target=".content-box" 
        hx-swap="innerHTML"
        hx-push-url="true"
        onclick="document.getElementById('left-menu').classList.remove('toggle')"
        type="button">

        <span class="left-menu-links-icon">
          {{ template "svg_calendar" . }}
        </span>

        <span class="left-menu-links-link">
          Calendar
        </span>
      </button>

      <button
        class="left-menu-links-row"
        hx-get="/events"
        hx-target=".content-box"
        hx-swap="innerHTML"
        hx-push-url="true"
        onclick="document.getElementById('left-menu').classList.remove('toggle')"
        type="button">
        
        <span class="left-menu-links-icon">
          {{ template "svg_events" . }}
        </span>

        <span class="left-menu-links-link">
          Events
        </span>
      </button>

      <button 
        class="left-menu-links-row"
        hx-post="/files" 
        hx-target=".content-box" 
        hx-swap="innerHTML"
        hx-push-url="true"
        onclick="document.getElementById('left-menu').classList.remove('toggle')"
        type="button">

        <span class="left-menu-links-icon">
          {{ template "svg_files" . }}
        </span>

        <span class="left-menu-links-link">
          Files
        </span>
      </button>
    </div>
  </div>

{{ end }}


{{ define "left_sidebar_script" }}
  <script>
      document.getElementById("menu-button").addEventListener("click", () => {
        document.getElementById("left-menu").classList.toggle("toggle");
      });
    </script>
    
    <script>
      document.getElementById("close-left-menu").addEventListener("click", () => {
        document.getElementById("left-menu").classList.toggle("toggle");
      });
    </script>
{{ end }}
