{{ define "profile_page_header" }}
  <header class="chat-main-header">
    <a
      class="chat-main-header-left"
      href="{{ .BackURL }}"
      aria-label="Back">
      {{ template "svg_back" . }}
    </a>

    <div class="chat-main-header-center">
      {{ .Title }}
    </div>

    <button
      id="profile-page-options-open"
      class="chat-main-header-right"
      type="button"
      aria-label="Options"
      aria-haspopup="dialog"
      aria-controls="profile-page-options-dialog">
      {{ template "svg_options" . }}
    </button>
  </header>

  <dialog
    id="profile-page-options-dialog"
    class="profile-page-options-dialog"
    aria-label="{{ .Title }} options">
    <a class="profile-page-options-item" href="{{ .HelpURL }}">
      <span aria-hidden="true">
        {{ template "svg_help" . }}
      </span>
      <span>Help</span>
    </a>
  </dialog>

  <script>
    {
      const optionsButton = document.getElementById("profile-page-options-open")
      const optionsDialog = document.getElementById("profile-page-options-dialog")

      optionsButton.addEventListener("click", () => {
        optionsDialog.showModal()
      })

      optionsDialog.addEventListener("click", (event) => {
        const bounds = optionsDialog.getBoundingClientRect()
        const clickedOnBackdrop =
          event.clientX < bounds.left ||
          event.clientX > bounds.right ||
          event.clientY < bounds.top ||
          event.clientY > bounds.bottom

        if (clickedOnBackdrop) optionsDialog.close()
      })

      optionsDialog.addEventListener("close", () => {
        optionsButton.focus()
      })
    }
  </script>
{{ end }}
