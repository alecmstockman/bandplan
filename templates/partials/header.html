

{{ define "bandplan_header" }}
  <section id="bandplan-header"
    class="header">
    <div class="menu">
      <button 
        class="open-side-menu-button"
        type="button" 
        id="menu-button">
        {{ template "svg_hamburger_menu" . }}
      </button>          
    </div>

    <div id="header-left-spacer"></div>

    <div class="header-center">
      <h1 class="title">BandPlan</h1>
      <h2 class="band">{{ capitalizeBandName .Band.Name }}</h2>
    </div>

    <button id="notification-box">
      <!-- <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bell preview-icon"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg> -->
    </button>

    <div class="account">
      <button
        class="open-right-menu-button"
        type="button"
        id="right-menu-button">
        {{ if .User.ProfileImagePath }}
          <img
            class="profile-pic-display"
            src="{{ smallImagePath .User.ProfileImagePath }}"
            alt="profile picture">
        {{ else }}
          {{ template "svg_user_default_image" "profile-pic-display" }}
        {{ end }} 
      </button>
    </div>
  </section>
{{ end }}
