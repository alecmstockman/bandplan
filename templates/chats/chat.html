<!DOCTYPE html>
<html>

  {{ template "head" .}}

  <body>
    <div class="content-box">

      {{ template "bandplan_header" . }}
      {{ template "chat-main-content" . }}
      {{ template "chat_popup" . }}
      
    </div>

    {{ template "left_sidebar_menu" .}}
    {{ template "right-sidebar" . }}
    {{ template "sidebar_scripts" . }}

    <script src="/static/js/chat-websocket.js?v=2.1"></script>


    <script id="chat-load-previous-messages">
      const chatContainer = document.getElementById("messages");
      const loadTrigger = document.getElementById("chat-load-trigger");

      let isLoading = false;
      let hasMoreMessages = true;

      const observer = new IntersectionObserver((entries) => {
          const entry = entries[0];

          if (!entry.isIntersecting) return;
          if (isLoading) return;
          if (!hasMoreMessages) return;

          console.log("Load older messages");

      }, {
          root: chatContainer,
          rootMargin: "300px 0px 0px 0px",
          threshold: 0,
      });

      observer.observe(loadTrigger);
    </script>

    <script id="message-copy">
      async function copyMessageToClipboard(button) {
        const messageElement =
          document.getElementById("popup-message-text");

        if (!messageElement) {
          console.error("Popup message body not found");
          return;
        }

        const messageBody = messageElement.textContent.trim();

        try {
          await navigator.clipboard.writeText(messageBody);
          console.log("Message copied:", messageBody);
        } catch (error) {
          console.error("Unable to copy message:", error);
        }
      }
    </script>

    <script id="message-input-resize">
      function resizeMessageInput(input) {
          input.style.height = "42px";

          const borders = input.offsetHeight - input.clientHeight;
          const height = Math.max(42, input.scrollHeight + borders);

          input.style.height = `${Math.min(height, 114)}px`;
      }
    </script>
    
  </body>
</html>
