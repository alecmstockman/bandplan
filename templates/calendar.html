<!DOCTYPE html>
<html lang="en">

  {{ template "head" . }}

  <body>
    <div class="content-box">

      {{ template "bandplan_header" . }}

      <div class="calendar-box">

        <header class="events-page-header">
          <div class="events-page-heading">
            <span class="events-page-title">Calendar</span>
            <span class="events-page-subtitle">Manage your band's calendar</span>
          </div>

          <a
            class="events-add-button"
            type="button"
            href="events/create">
            New Event
          </a>
        </header>

        <div id="calendar"></div>
      </div>

    </div>

    {{ template "left_sidebar_menu" .}}
    {{ template "right-sidebar" . }}
    {{ template "backdrop" . }}
    {{ template "sidebar_scripts" . }}

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const calendarEl = document.getElementById("calendar");

        const calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: "dayGridMonth",
          headerToolbar: {
            left: "prev title next today",
            center: "",
            right: "dayGridMonth,timeGridWeek,timeGridDay,listMonth",
          },
          buttonText: {
            today: "Today",
            month: "Month",
            week: "Week",
            day: "Day",
            list: "List",
          },
          height: "100%",
          events: "/calendar/events",
          dayMaxEvents: 3,

          dateClick: function(info) {
            console.log("dateClick info.el: ", info.el)
            console.log("info: ", info)
            calendar.changeView("timeGridDay", info.datestr);
          },

          eventClick(info) {
            console.log("info.el: ", info.el)
            console.log("info: ", info)

            if (info.view.type === "dayGridMonth") {
              info.jsEvent.preventDefault();
              calendar.changeView("timeGridDay", info.datestr);
            };
          }
        });

        console.log(calendar.events)

        calendar.render();
      });

    </script>

  </body>
</html>
