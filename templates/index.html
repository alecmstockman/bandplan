<!DOCTYPE html>
<html>

  {{ template "head" .}}

  <body>
    <div class="content-box">

      <div class="header">

        <div class="menu">
          <button 
            class="open-side-menu-button"
            type="button" 
            id="menu-button">
            ☰
          </button>
          
          <div class="side-menu" id="left-menu">
            <div class="side-menu-header">
              <button 
                class="close-left-menu-button" 
                type="button" 
                id="close-left-menu">
                ❮
              </button>
            </div>

            <button 
              class="side-menu-button" 
              hx-post="/" 
              hx-target=".content-box" 
              hx-swap="innerHTML"
              type="button">
              {{ template "svg_chat" . }}
              <span>Chat</span>
            </button>

            <button
              class="side-menu-button"
              hx-get="/songs"
              hx-target=".content-box"
              hx-swap="innerHTML"
              hx-push-url="true"
              onclick="document.getElementById('left-menu').classList.remove('toggle')"
              type="button">
              {{ template "svg_songs" . }}
              <span>Songs</span>
            </button>

            <button 
              class="side-menu-button" 
              hx-post="/setlists" 
              hx-target=".content-box" 
              hx-swap="innerHTML"
              hx-push-url="true"
              onclick="document.getElementById('left-menu').classList.remove('toggle')"
              type="button">
              {{ template "svg_setlists" . }}
              <span>Setlists</span>          
            </button>

            <button
              class="side-menu-button"
              hx-get="/promotion"
              hx-target=".content-box"
              hx-swap="innerHTML"
              hx-push-url="true"
              onclick="document.getElementById('left-menu').classList.remove('toggle')"
              type="button">
              {{ template "svg_promotion" . }}
              <span>Promotion</span>
            </button>

            <button 
              class="side-menu-button" 
              hx-post="/goals" 
              hx-target=".content-box" 
              hx-swap="innerHTML"
              hx-push-url="true"
              onclick="document.getElementById('left-menu').classList.remove('toggle')"
              type="button">
              {{ template "svg_goals" . }}
              <span>Goals</span>
            </button>

            <button 
              class="side-menu-button" 
              hx-post="/calendar" 
              hx-target=".content-box" 
              hx-swap="innerHTML"
              hx-push-url="true"
              onclick="document.getElementById('left-menu').classList.remove('toggle')"
              type="button">
              {{ template "svg_calendar" . }}
              <span>Calendar</span>
            </button>

            <button
              class="side-menu-button"
              hx-get="/events"
              hx-target=".content-box"
              hx-swap="innerHTML"
              hx-push-url="true"
              onclick="document.getElementById('left-menu').classList.remove('toggle')"
              type="button">
              {{ template "svg_events" . }}
              <span>Events</span>
            </button>

            <button 
              class="side-menu-button" 
              hx-post="/files" 
              hx-target=".content-box" 
              hx-swap="innerHTML"
              hx-push-url="true"
              onclick="document.getElementById('left-menu').classList.remove('toggle')"
              type="button">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder-icon lucide-folder"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
              <span>Files</span>
            </button>
          </div>

        </div>

        <div class="header-center">
          <h1 class="title">BandPlan</h1>
          <h2 class="band">{{ .Band.Name }}</h2>
        </div>
    
      
        <div class="account">
          <button 
            class="open-right-menu-button"
            type="button"
            id="right-menu-button">
            😵‍💫
          </button>

          <div class="right-menu" id="right-menu">
            <div class="right-menu-header">
              <button 
                class="close-right-menu-button" 
                type="button" 
                id="close-right-menu">
                ❯
              </button>
            </div>

            <button 
              class="right-menu-button">
              <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" height="24" 
                viewBox="0 0 24 24" fill="none" 
                stroke="currentColor" stroke-width="2.5" 
                stroke-linecap="round" stroke-linejoin="round" 
                class="lucide lucide-settings-icon lucide-settings">
                <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <span>Settings</span>
            </button>

            <button 
              class="right-menu-button"
              hx-post="/delete" 
              hx-target="#messages" 
              hx-swap="innerHTML">
              <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" height="24" 
                viewBox="0 0 24 24" fill="none" 
                stroke="currentColor" stroke-width="2.5" 
                stroke-linecap="round" stroke-linejoin="round" 
                class="lucide lucide-trash2-icon lucide-trash-2">
                <path d="M10 11v6"/><path d="M14 11v6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                <path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              <span>Delete All Messages</span>
            </button>

            <button 
              class="right-menu-button" 
              hx-post="/logout">
              <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" height="24" viewBox="0 0 24 24" 
                fill="none" stroke="currentColor" 
                stroke-width="2.5" stroke-linecap="round" 
                stroke-linejoin="round" class="lucide lucide-log-out-icon lucide-log-out">
                <path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              </svg>
              <span>logout</span>
            </button>
                     

          </div>
        </div>
      </div>
      
      <div id="main-content">

        <ul
          class="messages"
          id="messages" 
          style="list-style-type: none"
          hx-get="/messages"
          hx-trigger="load, every 2s"
          hx-swap="innerHTML"
          hx-on::after-swap="this.scrollTop = this.scrollHeight">


          {{ range .Messages }}
            {{ if eq .UserID $.User.UserID }}
              <li class="message-own">
                <div class="message-body">{{ .Body }}</div>
              </li>
            {{ else }}
              <li class="message-other">
                <div class="message-header">{{ .UserName }}</div>
                <div class="message-body">{{ .Body }}</div>
              </li>
            {{ end }}
          {{ end }}

        </ul>

        <div class="bottom-controls">
          <form
            class="message-entry"
            hx-post="/send"
            hx-target="#messages"
            hx-swap="beforeend"
            hx-on::after-request="this.reset()">
            <input type="text" name="message" placeholder="Type a message">
            <button class="send-button" type="submit">send</button>
          </form>
        </div>
      </div>

    </div>


    <script>
      document.getElementById("menu-button").addEventListener("click", () => {
        document.getElementById("left-menu").classList.toggle("toggle");
      });
    </script>
    
    <script>
      document.getElementById("close-left-menu").addEventListener("click", () => {
        document.getElementById("left-menu").classList.toggle("toggle");
      });
    </script>

    <script>
      document.getElementById("right-menu-button").addEventListener("click", () => {
        document.getElementById("right-menu").classList.toggle("toggle");
      });
    </script>
    
    <script>
      document.getElementById("close-right-menu").addEventListener("click", () => {
        document.getElementById("right-menu").classList.toggle("toggle");
      });
    </script>

  </body>
</html>
