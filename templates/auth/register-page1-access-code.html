<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/static/css/core/auth.css">
    <link rel="stylesheet" href="/static/css/core/variables.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{ template "service_worker" . }}
  </head>

  <body>
        
    <div class="content-box">
      <div class="signin-box">
        <h1 class="title">BandPlan</h1>

        <h3 class="sub-title"> The app for bands </h3>

        <form
          class="register-form"
          action="/register/2"
          method="post">

          <span class="access-code-head">Do you have an access code?</span>

          <input type="hidden" name="registration-id" value="{{ .RegistrationToken }}">
          <input type="hidden" name="gorilla.csrf.Token" value="{{ .CSRFToken }}">

          {{ if . }}
            <input 
              class="login-form-input"
              type="text" 
              name="access-code" 
              value="{{ .AccessCode }}">
          {{ else }}
            <input 
              class="login-form-input"
              type="text" 
              name="access-code" 
              placeholder="Enter Your Access Code">
          {{ end }}

          <div class="button-row-join">
            <button
              class="login-button login-button-join register-back-button" 
              type="submit"
              name="skip-access-code"
              value="true"
              formaction="/register/2"
              formmethod="post"
              formnovalidate>
              I Do Not
            </button>
            <button 
              class="login-button login-button-join" 
              submit>
              Enter
            </button>
          </div>

          <a
            class="register-login"
            href="/login"
            method="get">
            Already have an account? Login
          </a>
          
        </form>
        <div id="register-message"></div>
      </div>
    </div>
    
  </body> 
</html>
