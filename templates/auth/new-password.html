<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    <script src="/static/js/htmx-2.0.4.min.js"></script>
    <script src="/static/js/main.js" defer></script>
    <link rel="stylesheet" href="/static/css/core/auth.css">
    <link rel="stylesheet" href="/static/css/core/variables.css">

    {{ template "service_worker" . }}
  </head>

  <body>
    <main class="content-box">
      <h1 class="title">BandPlan</h1>
      <h3 class="sub-title">Set a new password</h3>

      <p id="login-subheader-one">Enter and confirm your new password.</p>

      <form
        class="login-form password-reset-form"
        hx-post="/password/reset/update"
        hx-target="#new-password-message"
        hx-swap="innerHTML">
        <input type="hidden" name="gorilla.csrf.Token" value="{{ .CSRFToken }}">
        <input type="hidden" name="token" value="{{ .Token }}">

        <input
          class="login-form-input"
          type="password"
          name="password"
          minlength="8"
          maxlength="255"
          autocomplete="new-password"
          placeholder="Enter New Password"
          required
          autofocus>

        <input
          class="login-form-input"
          type="password"
          name="password-confirmation"
          minlength="8"
          maxlength="255"
          autocomplete="new-password"
          placeholder="Confirm New Password"
          required>

        <div class="button-row">
          <button
            id="password-reset-button"
            class="login-button password-reset-button"
            type="submit">
            Set New Password
          </button>
        </div>
      </form>

      <a id="login-password-reset" href="/login">Back to login</a>

      <div
        id="new-password-message"
        class="login-error-message"
        aria-live="polite">
      </div>
    </main>

    <script>
      const passwordResetButton = document.getElementById("password-reset-button");
      let passwordUpdatedTimeout;

      window.history.replaceState(
        {},
        document.title,
        "/password/reset/update"
      );

      document.addEventListener("htmx:beforeRequest", (event) => {
        if (!event.detail.elt.matches(".password-reset-form")) {
          return;
        }

        passwordResetButton.disabled = true;
      });

      document.addEventListener("htmx:beforeSwap", (event) => {
          const target = event.detail.target;

          if (!(target instanceof HTMLElement) || target.id !== "new-password-message") {
              return;
          }

          if ([202].includes(event.detail.xhr.status)) {
              event.detail.shouldSwap = true;
              event.detail.isError = false;
          }
      });

      document.addEventListener("htmx:responseError", () => {
        const button = document.querySelector(".password-reset-button");
        button.disabled = false;
      });

      document.addEventListener("htmx:afterRequest", (event) => {
        if (!event.detail.elt.matches(".password-reset-form")) {
          return;
        }

        if (event.detail.xhr.status !== 202) {
          passwordResetButton.disabled = false;
        }
      });

      document.addEventListener("htmx:afterSwap", (event) => {
        const target = event.detail.target;

        if (
          !(target instanceof HTMLElement) ||
          target.id !== "new-password-message"
        ) {
          return;
        }

        if (event.detail.xhr.status === 202) {
          setTimeout(() => {
            window.location.assign("/login");
          }, 3000);
        }
      });

    </script>
  </body>
</html>
