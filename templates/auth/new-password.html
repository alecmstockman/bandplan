<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    <script src="/static/js/htmx-2.0.4.min.js"></script>
    <script src="/static/js/main.js" defer></script>
    <link rel="stylesheet" href="/static/css/core/auth.css">
    <link rel="stylesheet" href="/static/css/core/variables.css">

    {{ template "service_worker" . }}
  </head>

  <body>
    <main class="content-box">
      <h1 class="title">BandPlan</h1>
      <h3 class="sub-title">Set a new password</h3>

      <p id="login-subheader-one">Enter and confirm your new password.</p>

      <form
        class="login-form password-reset-form"
        hx-post="/password/reset/update"
        hx-target="#new-password-message"
        hx-swap="innerHTML">
        <input type="hidden" name="gorilla.csrf.Token" value="{{ .CSRFToken }}">
        <input type="hidden" name="token" value="{{ .Token }}">

        <input
          class="login-form-input"
          type="password"
          name="password"
          minlength="8"
          maxlength="255"
          autocomplete="new-password"
          placeholder="Enter New Password"
          required
          autofocus>

        <input
          class="login-form-input"
          type="password"
          name="password-confirmation"
          minlength="8"
          maxlength="255"
          autocomplete="new-password"
          placeholder="Confirm New Password"
          required>

        <div class="button-row">
          <button
            class="login-button password-reset-button"
            type="submit">
            Set New Password
          </button>
        </div>
      </form>

      <a id="login-password-reset" href="/login">Back to login</a>

      <div
        id="new-password-message"
        class="login-error-message"
        aria-live="polite">
      </div>
    </main>
  </body>
</html>
