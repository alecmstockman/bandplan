<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script src="/static/js/htmx-2.0.4.min.js"></script>
    <script src="/static/js/main.js" defer></script>
    <link rel="stylesheet" href="/static/css/core/auth.css">
    <link rel="stylesheet" href="/static/css/core/variables.css">

    {{ template "service_worker" . }}
  </head>

  <body>
    <main class="content-box">
      <h1 class="title">BandPlan</h1>
      <h3 class="sub-title">Reset your password</h3>

      <p id="login-subheader-one">Enter the email associated with your account.</p>
      <p id="login-subheader-two">We'll send you a link to choose a new password.</p>

      <form
        class="login-form password-reset-form"
        hx-post="/password/reset"
        hx-target="#password-reset-message"
        hx-swap="innerHTML">
        <input type="hidden" name="gorilla.csrf.Token" value="{{ .CSRFToken }}">

        <input
          class="login-form-input"
          type="email"
          name="email"
          autocomplete="email"
          placeholder="Enter Email"
          required
          autofocus>

        <div class="button-row">
          <button
            class="login-button password-reset-button"
            type="submit">
            Send Reset Link
          </button>
        </div>
      </form>

      <a id="login-password-reset" href="/login">Back to login</a>

      <div
        id="password-reset-message"
        class="login-error-message"
        aria-live="polite">
      </div>
    </main>
  </body>
</html>
