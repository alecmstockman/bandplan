<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="/static/js/htmx-2.0.4.min.js"></script>
    <script src="/static/js/main.js" defer></script>
    <link rel="stylesheet" href="/static/css/core/auth.css">
    <link rel="stylesheet" href="/static/css/core/variables.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {{ template "service_worker" . }}
  </head>

  <body>
    
    <div class="content-box">
      <h1 class="title">BandPlan</h1>
      <h3 class="sub-title">The app for bands</h3>

      <h3>We couldn't send your verification email.</h3>
      <p>Use the button below to try again.</p>

      <form
        class="login-form"
        action="/email/verification/resend"
        method="POST">

        <input type="hidden" name="gorilla.csrf.Token" value="{{ .CSRFToken }}">
        <input type="hidden" name="email" value="{{ .Email }}">

        <div class="button-row">
          <button 
            class="login-button" 
            type="submit">
            Resend Verification Email
          </button>
        </div>

      </form>

    </div>
  </body>
</html>
