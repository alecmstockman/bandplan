

<div class="song-download-query-page"> 

  <div class="song-download-query-header">
    <div id="song-download-query-header-title">Search Results:</div>
  </div>

  <div class="songs-itunes-results-list">
    
    {{ range .}}
      <div class="itunes-result-card">
        <img
          class="itunes-result-card-left"
          src="{{ .ArtworkPath }}"
          >

        <div class="itunes-result-card-info">
          <span class="itunes-result-card-title">{{ .Title }}</span>
          <span>{{ .ArtistName }}</span>
          <span>{{ .AlbumTitle }}</span>
        </div>

        <div class="itunes-result-card-right">
          <button
            class="itunes-result-card-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-plus-icon lucide-square-plus"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
            Add to Songs
          
          </button>
        </div>
        
      </div>
    {{ end }}


  </div>

  </div>
</div>
