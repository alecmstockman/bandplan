<!DOCTYPE html>
<html lang="en">
  
  {{ template "head" . }}

  <body>

    <div class="content-box">

      <div class="song-edit-header">

        <a 
          class="song-edit-header-back-button" 
          href="/song?id={{ .Song.SongID }}">
          <svg 
            xmlns="http://www.w3.org/2000/svg" 
            width="48" height="48" viewBox="0 0 24 24" 
            fill="none" stroke="currentColor" 
            stroke-width="3" stroke-linecap="round" 
            stroke-linejoin="round" 
            class="lucide lucide-chevron-left-icon lucide-chevron-left">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </a>

        <div class="song-edit-header-title">Edit Song Info</div>

        <div 
          class="song-edit-header-right">
          <button
            class="song-edit-header-right-button"
            type="submit"
            form="song-edit-form">
            <svg 
              xmlns="http://www.w3.org/2000/svg" 
              width="32" height="32" viewBox="0 0 24 24" 
              fill="none" stroke="currentColor" 
              stroke-width="1.5" stroke-linecap="round" 
              stroke-linejoin="round" class="lucide lucide-save-icon lucide-save">
              <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
              <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/>
              <path d="M7 3v4a1 1 0 0 0 1 1h7"/>
            </svg>
          </button>
        </div>
      </div>


      <form 
        id="song-edit-form" 
        class="song-edit-form" 
        method="POST" 
        action="/song/update"
        enctype="multipart/form-data">
        <input type="hidden" name="song-id" value="{{ .Song.SongID }}">

        <div class="song-edit-display">

          <div class="song-edit-card">
            <div class="song-edit-card-row">
              <span class="song-edit-label">Title:</span>
              <input class="song-edit-form song-edit-input" type="text" name="song-title" value="{{ .Song.Title }}">
            </div>

            <div class="song-edit-card-row">
              <span class="song-edit-label">Artist Name:</span>
              <input class="song-edit-form song-edit-input" type="text" name="artist-name" value="{{ .Song.ArtistName }}">
            </div>

            <div class="song-edit-card-row">
              <span class="song-edit-label">Artwork Filepath:</span>
              <input 
                id="song-edit-artwork-path"
                class="song-edit-form song-edit-input" 
                type="file" 
                name="artwork-path" 
                accept="image/*"
                value="{{ .Song.ArtworkPath }}">
            </div>

            <div class="song-edit-card-row">
              <span class="song-edit-label">Album:</span>
              <input class="song-edit-input" type="text" name="album-name" value="{{ .Song.AlbumTitle }}">
            </div>

            <div class="song-edit-card-row-time">
              <span class="song-edit-label">Length:</span>
              <input 
                class="song-edit-input-minutes" 
                type="number" name="minutes" 
                value="{{ formatMinutes .Song.LengthSeconds }}">
              :
              <input 
                class="song-edit-input-seconds"
                type="number=" name="seconds"
                value="{{ formatSeconds .Song.LengthSeconds }}">
            </div>

            <div class="song-edit-card-row">
              <span class="song-edit-label">Genre:</span>
              <input class="song-edit-input" type="text" name="genre" value="{{ .Song.Genre }}">
            </div>

            <div class="song-edit-card-row">
              <span class="song-edit-label">Release Date:</span>
              <input 
                class="song-edit-input" 
                type="date" 
                name="release-date" 
                value="{{ formatReleaseDate .Song.ReleaseDate }}">
            </div>
          </div>

          <div class="song-edit-card">

            <div class="song-edit-card-row">
              <span class="song-edit-label">Recording BPM:</span>
              <input class="song-edit-input" type="text" name="recording-bpm" value="{{ .Song.RecordingBPM }}">
            </div>
            
            <div class="song-edit-card-row">
              <span class="song-edit-label">Live BPM:</span>
              <input class="song-edit-form song-edit-input" type="text" name="live-bpm" value="{{ .Song.LiveBPM }}">
            </div>

            <div class="song-edit-card-row">
              <span class="song-edit-label">Key:</span>
              <input class="song-edit-input" type="text" name="musical-key" value="{{ .Song.MusicalKey }}">
            </div>

            <div class="song-edit-card-row">
              <span class="song-edit-label">Tuning:</span>
              <input class="song-edit-input" type="text" name="tuning" value="{{ .Song.Tuning }}">
            </div>

            <div class="song-edit-card-row">
              <span class="song-edit-label">Capo:</span>
              <input class="song-edit-input" type="text" name="capo" value="{{ .Song.Capo }}">
            </div>

          </div>

          <div class="song-edit-card">
            <div class="song-edit-card-row">
              <span class="song-edit-label">Spotify:</span>
              <input
                class="song-edit-form song-edit-input"
                name="spotify-link"
                value="{{ .Song.SpotifyLink }}">
              </input>
            </div>

            <div class="song-edit-card-row">
              <span class="song-display-label">Apple Music:</span>
              <input
                class="song-edit-form song-edit-input"
                name="apple-music-link"
                value="{{ .Song.AppleMusicLink }}">
            </input>
            </div>

            <div class="song-edit-card-row">
              <span class="song-edit-label">YouTube:</span>
              <input 
                class="song-edit-form song-edit-input"
                name="youtube-link"
                value="{{ .Song.YouTubeLink }}">
              </input>
            </div>

            <div class="song-edit-card-row">
              <span class="song-edit-label">Amazon Music:</span>
              <input 
                class="song-edit-form song-edit-input"
                name="amazon-music-link"
                value="{{ .Song.AmazonMusicLink }}">
              </input>
            </div>

            <div class="song-edit-card-row">
              <span class="song-edit-label">Pandora:</span>
              <input 
                class="song-edit-form song-edit-input"
                name="pandora-link"
                value="{{ .Song.PandoraLink }}">
              </input>
            </div>

            <div class="song-edit-card-row">
              <span class="song-edit-label">Deezer:</span>
              <input 
                class="song-edit-form song-edit-input"
                name="deezer-link"
                value="{{ .Song.DeezerLink }}">
              </input>
            </div>

            <div class="song-edit-card-row">
              <span class="song-display-label">Other:</span>
              <input
                class="song-edit-form song-edit-input"
                name="other-link"
                value="{{ .Song.OtherLink }}">
              </input>
            </div>
          </div>

          <div class="song-edit-card song-edit-lyrics-card">
            <div class="song-edit-card-row">
              <span class="song-edit-label-full">Lyrics:</span>
            </div>

            <div class="song-edit-large-field">
              <textarea 
                class="song-edit-lyrics"
                name="lyrics">{{ .Song.Lyrics }}
              </textarea>
            </div>
          </div>

          <div class="song-edit-card song-edit-lyrics-card">
            <div class="song-edit-card-row">
              <span class="song-edit-label-full">Description:</span>
            </div>

            <div class="song-edit-large-field">
              <textarea 
                class="song-edit-lyrics"
                name="description">{{ .Song.Description }}</textarea>
            </div>
          </div>

          <div class="song-edit-card song-edit-lyrics-card">
            <div class="song-edit-card-row">
              <span class="song-edit-label-full">Notes:</span>
            </div>

            <div class="song-edit-large-field">
              <textarea 
                class="song-edit-lyrics"
                name="notes">{{ .Song.Notes }}
              </textarea>
            </div>
          </div>

        </div> 
      </form>
    </div>
  </body>
</html>
