<!DOCTYPE html>
<html lang="en">

  {{ template "head" . }}

<body>
  <div class="content-box">

    {{ template "bandplan_header" . }}

    <div class="event-create-content-box">
      <form
        class="setlist-add-form"
        method="post"
        action="/goal/add">

        <input type="hidden" name="gorilla.csrf.Token" value="{{ .CSRFToken }}">

        <div class="setlist-add-header">
          <a
            class="setlist-add-header-left"
            href="/goals"
            aria-label="back to goals">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
          </a>

          <div class="setlist-add-header-center">Create Goals List</div>
          <button
            class="setlist-add-header-right"
            type="submit"
            aria-label="create goals list">
            {{ template "svg_add" . }}
          </button>
        </div>

        <div class="setlist-add-card-box">
          <div class="setlist-add-card">
            <div class="event-add-field-row-label">
              {{ template "svg_write" . }}

              <span class="setlist-add-card-label">
                Goals List:
              </span>
            </div>

            <input
              id="goals-list-name"
              class="setlist-field-row-input"
              type="text"
              name="goals-list-name"
              value="{{ .GoalsList.Name }}"
              placeholder="Goals List Name"
              maxlength="120"
              required
              autofocus
            >

            <textarea
              id="goals-list-description"
              class="event-create-notes-input notes-input"
              name="goals-list-description"
              placeholder="Description">{{ .GoalsList.Description }}</textarea>
          </div>

          <div class="add-setlist-card"></div>
        </div>
      </form>
    </div>
  </div>

  {{ template "left_sidebar_menu" . }}
  {{ template "right-sidebar" . }}
  {{ template "backdrop" . }}
  {{ template "sidebar_scripts" . }}

  <script>
    document.addEventListener("input", function (event) {
      if (!event.target.matches(".notes-input")) return;

      const textarea = event.target;

      textarea.style.height = "auto";
      textarea.style.height = textarea.scrollHeight + "px";
    });
  </script>

</body>
</html>
