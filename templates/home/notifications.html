<!DOCTYPE html>
<html lang="en">

  {{ template "head" . }}

  <body>
    <div class="content-box notifications-page">
      <header class="notifications-header">
        <a
          id="notifications-back-button"
          class="notifications-back-button"
          href="/"
          aria-label="Go back">
          {{ template "svg_back" . }}
        </a>

        <h1>Notifications ({{ notificationsCount .Notifications }})</h1>
        <form
          id="notifications-mark-read"
          method="post"
          action="/notifications/mark-read">

          <input type="hidden" name="gorilla.csrf.Token" value="{{ .CSRFToken }}">

          <button
            method="post"
            type="submit">
            Mark All as Read
        </button>
        </form>

      </header>

      <main class="notifications-content">

        {{ if .VAPIDPublicKey }}
          <button 
            type="button" id="enable-push"
            data-vapid-public-key="{{ .VAPIDPublicKey }}"
            data-csrf-token="{{ .CSRFToken }}">
            Enable push on this device
          </button>
          <p id="push-status" role="status"></p>
          <script src="/static/js/push-notifications.js" defer></script>
        {{ end }}

        <ul class="notifications-list">
          {{ range .Notifications }}
            {{ if not .ReadAt }}
              <li>
                <form
                  class="notification-card-form"
                  method="post"
                  action="/notification?notification-id={{ .NotificationID }}">
                  <input type="hidden" name="gorilla.csrf.Token" value="{{ $.CSRFToken }}">
                  <button class="notification-card" type="submit">
                    {{ template "svg_user_default_image" "notification-card-image" }}
                    <span>{{ .CreatedByName }} {{ .Body }}</span>
                  </button>
                </form>
              </li>
            {{ else }}
              <li>
                <form
                  class="notification-card-form"
                  method="post"
                  action="/notification?notification-id={{ .NotificationID }}">
                  <input type="hidden" name="gorilla.csrf.Token" value="{{ $.CSRFToken }}">
                  <button class="notification-card notification-read" type="submit">
                    {{ template "svg_user_default_image" "notification-card-image" }}
                    <span>{{ .CreatedByName }} {{ .Body }}</span>
                  </button>
                </form>
              </li>
            {{ end }}
          {{ else }}
            <li class="notifications-empty">No notifications yet.</li>
          {{ end }}
        </ul>
      </main>
    </div>

    <script>
      document.getElementById("notifications-back-button")
        ?.addEventListener("click", () => window.history.back());

      const response = await fetch("/push/subscription", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRF-Token": enablePush.dataset.csrfToken,
        },
        body: JSON.stringify(subscription.toJSON()),
      });

      if (response.status !== 204) {
        throw new Error(`Could not save push subscription (${response.status})`);
      }

      pushStatus.textContent = "Push subscription saved.";

    </script>
  </body>
</html>
