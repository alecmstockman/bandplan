<!DOCTYPE html>
<html lang="en">

  {{ template "head" . }}

<body>
  <div class="content-box">
    <div class="header">

      <div class="menu">
        <button
          class="open-side-menu-button"
          type="button"
          id="menu-button">
          {{ template "svg_hamburger_menu" . }}
        </button>
      </div>

      <div class="header-center">
        <h1 class="title">BandPlan</h1>
        <h2 class="band">{{ capitalizeBandName .Band.Name }}</h2>
      </div>

      <div class="account">
        <button
          class="open-right-menu-button"
          type="button"
          id="right-menu-button">
          {{ if .User.ProfileImagePath }}
            <img
              class="profile-pic-display"
              src="{{ smallImagePath .User.ProfileImagePath }}"
              alt="profile picture"
            >
          {{ else }}
            {{ template "svg_user_default_image" "profile-pic-display" }}
          {{ end }}
        </button>
      </div>
    </div>

    <div class="event-create-content-box">
      <form
        class="setlist-add-form"
        method="post"
        action="/todo/add">

        <input type="hidden" name="gorilla.csrf.Token" value="{{ .CSRFToken }}">

        <div class="setlist-add-header">
          <a
            class="setlist-add-header-left"
            href="/todo"
            aria-label="back to to do lists">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
          </a>

          <div class="setlist-add-header-center">Create To Do List</div>
          <button
            class="setlist-add-header-right"
            type="submit"
            aria-label="create to do list">
            {{ template "svg_add" . }}
          </button>
        </div>

        <div class="setlist-add-card-box">
          <div class="setlist-add-card">
            <div class="event-add-field-row-label">
              {{ template "svg_write" . }}

              <span class="setlist-add-card-label">
                To Do List:
              </span>
            </div>

            <input
              id="todo-list-name"
              class="setlist-field-row-input"
              type="text"
              name="todo-list-name"
              value="{{ .ToDoList.Name }}"
              placeholder="To Do List Name"
              maxlength="120"
              required
              autofocus
            >

            <div class="card-divider-horizontal"></div>

            <div class="event-create-time-row">
              <label class="event-create-time-label" for="to-do-list-owner">Owner: </label>
              <select id="to-do-list-owner" class="event-field-row-input" name="to-do-list-owner" required>
                  <option value="Personal:{{ .User.UserID }}">Personal</option>
                  <option value="Band:{{ .Band.BandID }}">Band</option>
              </select>
            </div>

            <div class="event-create-time-row">
              <label class="event-create-time-label" for="to-do-assigned-to">Assigned To: </label>
              <select id="to-do-assigned-to" class="event-field-row-input" name="to-do-assigned-to" required>
                  <option value="none">None</option>
                  {{ range .Members }}
                    <option value="{{ .UserID }}">{{ .DisplayName }}</option>
                  {{ end }}
              </select>
            </div>

            <div class="event-create-time-row">
              <label class="event-create-time-label" for="to-do-due-date">Due Date: </label>
              <input
                id="to-do-due-date"
                class="event-field-row-input"
                type="date"
                name="to-do-due-date">
            </div>

            <div class="event-create-time-row">
              <label class="event-create-time-label" for="to-do-due-time">Due Time: </label>
              <input
                id="to-do-due-time"
                class="event-field-row-input"
                type="time"
                name="to-do-due-time">
            </div>

            <div class="event-create-time-row">
              <label class="event-create-time-label" for="to-do-due-timezone">Time Zone: </label>
              <select
                id="to-do-due-timezone"
                class="event-field-row-input event-create-timezone-select"
                name="to-do-due-timezone">
                <option value="UTC" {{ if eq .User.TimeZone "UTC" }}selected{{ end }}>UTC</option>
                <option value="America/New_York" {{ if eq .User.TimeZone "America/New_York" }}selected{{ end }}>Eastern Time</option>
                <option value="America/Chicago" {{ if eq .User.TimeZone "America/Chicago" }}selected{{ end }}>Central Time</option>
                <option value="America/Denver" {{ if eq .User.TimeZone "America/Denver" }}selected{{ end }}>Mountain Time</option>
                <option value="America/Los_Angeles" {{ if eq .User.TimeZone "America/Los_Angeles" }}selected{{ end }}>Pacific Time</option>
                <option value="America/Anchorage" {{ if eq .User.TimeZone "America/Anchorage" }}selected{{ end }}>Alaska Time</option>
                <option value="Pacific/Honolulu" {{ if eq .User.TimeZone "Pacific/Honolulu" }}selected{{ end }}>Hawaii Time</option>
                <option value="Europe/London" {{ if eq .User.TimeZone "Europe/London" }}selected{{ end }}>United Kingdom</option>
                <option value="Europe/Dublin" {{ if eq .User.TimeZone "Europe/Dublin" }}selected{{ end }}>Ireland</option>
                <option value="Europe/Lisbon" {{ if eq .User.TimeZone "Europe/Lisbon" }}selected{{ end }}>Portugal</option>
                <option value="Europe/Berlin" {{ if eq .User.TimeZone "Europe/Berlin" }}selected{{ end }}>Central Europe</option>
                <option value="Europe/Helsinki" {{ if eq .User.TimeZone "Europe/Helsinki" }}selected{{ end }}>Eastern Europe</option>
              </select>
            </div>

            <div class="card-divider-horizontal"></div>

            <div class="event-create-time-row">
              <label class="event-create-time-label" for="to-do-song">Song: </label>
              <select id="to-do-song" class="event-field-row-input" name="to-do-song" required>
                  <option value="none">None</option>
                  {{ range .Songs }}
                    <option value="{{ .SongID }}">{{ .Title }}</option>
                  {{ end }}
              </select>
            </div>

            <div class="event-create-time-row">
              <label class="event-create-time-label" for="to-do-setlist">Setlist: </label>
              <select id="to-do-setlist" class="event-field-row-input" name="to-do-setlist" required>
                  <option value="none">None</option>
                  {{ range .Setlists }}
                    <option value="{{ .SetlistID }}">{{ .Name }}</option>
                  {{ end }}
              </select>
            </div>

            <div class="event-create-time-row">
              <label class="event-create-time-label" for="to-do-event">Event: </label>
              <select id="to-do-event" class="event-field-row-input" name="to-do-event" required>
                  <option value="none">None</option>
                  {{ range .Events }}
                    <option value="{{ .EventID }}">{{ .Name }}</option>
                  {{ end }}
              </select>
            </div>

            <div class="card-divider-horizontal"></div>

            <textarea
              id="todo-list-description"
              class="event-create-notes-input notes-input"
              name="todo-list-description"
              placeholder="Description">{{ .ToDoList.Description }}</textarea>
          </div>

          <div class="add-setlist-card"></div>
        </div>
      </form>
    </div>
  </div>

  {{ template "left_sidebar_menu" . }}
  {{ template "right_sidebar" . }}
  {{ template "backdrop" . }}
  {{ template "sidebar_scripts" . }}

  <script>
    document.addEventListener("input", function (event) {
      if (!event.target.matches(".notes-input")) return;

      const textarea = event.target;

      textarea.style.height = "auto";
      textarea.style.height = textarea.scrollHeight + "px";
    });
  </script>

</body>
</html>
