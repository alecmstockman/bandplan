<!DOCTYPE html>
<html lang="en">

  {{ template "head" .}}

  <body>
    <div class="content-box">

      <header class="settings-header">
        <a
          class="settings-header-back-button"
          href="{{ .BackURL }}">
          {{ template "svg_back" . }}
        </a>
        <div class="settings-header-title">
          To-Do List
        </div>
        <div class="settings-header-right"></div>
      </header>

      <header class="setlists-header">
        <div class="setlists-header-left"></div>

        <div class="setlists-header-center">
          <span class="setlists-header-top">
            {{ .List.Name }}
          </span>
        </div>

        <div class="setlists-header-right">
          <button
            class="setlists-add-setlist"
            id="todo-create-item-button">
            {{ template "svg_setlists_add" . }}
          </button>
        </div>

      </header>

      <div class="todo-list-box">
        <ul>
          {{ range .List.Items }}

          {{ end }}
        </ul>
      </div>
    </div>

    <dialog id="todo-create-item-box">
      <input type="hidden" name="todo-list-id" value="{{ .List.ToDoListID }}">

    </dialog>

    <script id="create-todo-item-script">
      const todoCreateBox = document.getElementById("todo-create-item-box")
      const todoCreateButton = document.getElementById("todo-create-item-button")

      todoCreateBox.addEventListener("click", (event) => {
        const bounds = todoCreateBox.getBoundingClientRect();

        const clickedOnBackdrop =
          event.clientX < bounds.left ||
          event.clientX > bounds.right ||
          event.clientY < bounds.top ||
          event.clientY > bounds.bottom;

        if (clickedOnBackdrop) {
          todoCreateBox.close();
        }
      });

      todoCreateButton.addEventListener("click", ()=> {
        todoCreateBox.showModal();
      });


    </script>

  </body>
</html>
