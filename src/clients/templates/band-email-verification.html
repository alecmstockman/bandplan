<!DOCTYPE html>
<html lang="en">
  <body style="margin: 0; padding: 0; background-color: #111214; color: #eeeeee; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding: 40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 480px; background-color: #1c1e23; border: 1px solid #292d31; border-radius: 12px;">
            <tr>
              <td style="padding: 32px;">
                <p style="margin: 0 0 28px; color: #eeeeee; font-size: 24px; font-weight: bold;">Band<span style="color: #c92a2a;">Plan</span></p>
                <h1 style="margin: 0 0 16px; color: #eeeeee; font-size: 26px; line-height: 1.3;">Verify {{ .BandName }}'s email</h1>
                <p style="margin: 0 0 28px; color: #bfc3c9; font-size: 16px; line-height: 1.6;">Confirm that {{ .Email }} belongs to your band.</p>
                <a href="https://bandplan-production.up.railway.app/band/email/verification/page?token={{ .Token }}" style="display: inline-block; padding: 15px 24px; border: 1px solid #c92a2a; border-radius: 6px; background-color: #c92a2a; color: #ffffff; font-size: 16px; font-weight: bold; text-decoration: none;">Verify band email</a>
                <p style="margin: 28px 0 0; color: #9ca2ab; font-size: 13px; line-height: 1.6;">This link expires in 30 minutes.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
