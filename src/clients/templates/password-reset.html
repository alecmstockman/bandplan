<!doctype html>
<html lang="en">
  <body style="margin: 0; padding: 24px; background-color: #111214; color: #eeeeee; font-family: Arial, Helvetica, sans-serif;">
    <div style="max-width: 480px; margin: 0 auto; padding: 32px; border: 1px solid #292d31; border-radius: 12px; background-color: #1c1e23;">
      <p style="margin: 0 0 24px; font-size: 24px; font-weight: bold;">
        Band<span style="color: #c92a2a;">Plan</span>
      </p>

      <h1 style="margin: 0 0 16px; font-size: 24px;">Reset your password</h1>

      <p style="margin: 0 0 24px; color: #bfc3c9; line-height: 1.5;">
        Use the button below to choose a new password.
      </p>

      <a href="https://bandplan-production.up.railway.app/password/reset/update?token={{ .Token }}" style="display: inline-block; padding: 14px 22px; border-radius: 6px; background-color: #c92a2a; color: #ffffff; font-weight: bold; text-decoration: none;">
        Reset Password
      </a>

      <p style="margin: 24px 0 0; color: #9ca2ab; font-size: 13px; line-height: 1.5;">
        If you did not request a password reset, you can ignore this email.
      </p>
    </div>
  </body>
</html>
